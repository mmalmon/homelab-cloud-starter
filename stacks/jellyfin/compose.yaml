name: jellyfin

services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Etc/UTC}
      VIRTUAL_HOST: ${JELLYFIN_HOST:-}
      VIRTUAL_PORT: "8096"
      LETSENCRYPT_HOST: ${JELLYFIN_HOST:-}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-}
    volumes:
      - ./data/config:/config
      - ./data/cache:/cache
      - ${MEDIA_ROOT:-/mnt/raid/Library}:/media:ro
    networks:
      - proxy

networks:
  proxy:
    external: true
    name: homelab-proxy
