name: wud

services:
  wud:
    image: getwud/wud:latest
    container_name: wud
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WUD_PORT:-3000}:3000"
    environment:
      WUD_AUTH_ADMIN_USER: ${WUD_ADMIN_USER:?Set WUD_ADMIN_USER in .env}
      WUD_AUTH_ADMIN_PASSWORD: ${WUD_ADMIN_PASSWORD:?Set WUD_ADMIN_PASSWORD in .env}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/store
