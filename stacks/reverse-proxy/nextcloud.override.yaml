services:
  nextcloud:
    environment:
      VIRTUAL_HOST: ${NEXTCLOUD_HOST:-}
      VIRTUAL_PORT: "80"
      LETSENCRYPT_HOST: ${NEXTCLOUD_HOST:-}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-}
    networks:
      - nextcloud
      - proxy

  immich-server:
    environment:
      VIRTUAL_HOST: ${IMMICH_HOST:-}
      VIRTUAL_PORT: "2283"
      LETSENCRYPT_HOST: ${IMMICH_HOST:-}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-}
    networks:
      - immich
      - proxy

networks:
  proxy:
    external: true
    name: homelab-proxy
