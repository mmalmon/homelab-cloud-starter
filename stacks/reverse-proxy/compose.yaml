name: homelab-proxy

services:
  nginx-proxy:
    image: ${NGINX_PROXY_IMAGE:-nginxproxy/nginx-proxy:1.11}
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "${PROXY_BIND_ADDRESS:-0.0.0.0}:80:80"
      - "${PROXY_BIND_ADDRESS:-0.0.0.0}:443:443"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - certs:/etc/nginx/certs:ro
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
    networks:
      - proxy

  acme-companion:
    image: ${ACME_COMPANION_IMAGE:-nginxproxy/acme-companion:latest}
    container_name: nginx-proxy-acme
    restart: unless-stopped
    depends_on:
      - nginx-proxy
    environment:
      DEFAULT_EMAIL: ${LETSENCRYPT_EMAIL:-}
      NGINX_PROXY_CONTAINER: nginx-proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - certs:/etc/nginx/certs
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
      - acme:/etc/acme.sh
    networks:
      - proxy

networks:
  proxy:
    name: homelab-proxy

volumes:
  certs:
  vhost:
  html:
  acme:
