name: zigbee2mqtt

services:
  zigbee2mqtt:
    image: ghcr.io/koenkk/zigbee2mqtt:2.6.1
    container_name: zigbee2mqtt
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Etc/UTC}
      MQTT_URL: mqtt://mqtt:1883
      VIRTUAL_HOST: ${ZIGBEE2MQTT_HOST:-}
      VIRTUAL_PORT: "8080"
      LETSENCRYPT_HOST: ${ZIGBEE2MQTT_TLS_HOST:-}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-}
    devices:
      - ${ZIGBEE_ADAPTER:?Set ZIGBEE_ADAPTER to the host /dev/serial/by-id path}:/dev/ttyACM0
    volumes:
      - ./data:/app/data
      - /run/udev:/run/udev:ro
    networks:
      - mqtt
      - proxy

networks:
  mqtt:
    external: true
    name: homelab-mqtt
  proxy:
    external: true
    name: homelab-proxy
