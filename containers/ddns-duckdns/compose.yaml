name: homelab-ddns

services:
  duckdns:
    image: lscr.io/linuxserver/duckdns:version-2.0.0
    container_name: duckdns
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
      SUBDOMAINS: ${SUBDOMAINS:?Set SUBDOMAINS in .env}
      TOKEN: ${DUCKDNS_TOKEN:?Set DUCKDNS_TOKEN in .env}
      UPDATE_IP: ipv4
    volumes:
      - ./data:/config
