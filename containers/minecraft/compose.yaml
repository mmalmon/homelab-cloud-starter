name: minecraft

services:
  minecraft:
    image: itzg/minecraft-server:java21
    container_name: minecraft
    restart: unless-stopped
    ports:
      - "${MINECRAFT_BIND_ADDRESS:-127.0.0.1}:${MINECRAFT_PORT:-25565}:25565"
    environment:
      EULA: ${MINECRAFT_EULA:-FALSE}
      TYPE: VANILLA
      ENABLE_WHITELIST: "true"
      WHITELIST: ${MINECRAFT_WHITELIST:?Set MINECRAFT_WHITELIST in .env}
      ENABLE_RCON: "false"
      MEMORY: ${MINECRAFT_MEMORY:-2G}
    volumes:
      - ./data:/data
